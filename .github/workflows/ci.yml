name: Validate and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.16.3
        ports: ["6333:6333"]
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check eki scripts tests --select E9,F63,F7,F82
      - run: pytest -q
        env:
          TEST_QDRANT_URL: http://localhost:6333
          TEST_REDIS_URL: redis://localhost:6379/0
      - run: python scripts/evaluate.py
      - run: docker build -t enterprise-knowledge-intelligence:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: eval/results.json
