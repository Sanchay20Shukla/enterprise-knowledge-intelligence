[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-intelligence"
version = "0.1.0"
description = "Evidence-first enterprise RAG and deterministic analytics agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1", "langgraph>=1,<2", "qdrant-client>=1.14,<2",
  "rank-bm25==0.2.2", "numpy>=1.26,<3", "pypdf>=5,<7", "python-docx>=1.1,<2",
  "beautifulsoup4>=4.12,<5", "httpx>=0.28,<1", "redis>=5,<7",
  "prometheus-client>=0.21,<1", "openai>=1.60,<3", "tiktoken>=0.8,<1"
]
[project.optional-dependencies]
neural = ["fastembed>=0.6,<1"]
observability = ["langfuse>=3,<5"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
include = ["eki*"]
[tool.setuptools.package-data]
eki = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 120
